# Overrides only; everything else comes from the detekt defaults.
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  # Folders leave out each module's root package, which this rule cannot express.
  # The checkPackageLayout task enforces the layout instead.
  InvalidPackageDeclaration:
    active: false

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ParameterNaming:
    active: true
