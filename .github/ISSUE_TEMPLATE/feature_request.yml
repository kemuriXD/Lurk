name: Feature request
description: Suggest something Lurk could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe where Lurk falls short for you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Twitch
        - Kick
        - Both
        - Not platform specific
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other apps that do this well, screenshots, or the workaround you use now.
