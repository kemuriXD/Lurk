name: Bug report
description: Something in Lurk doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please check that it hasn't been reported already, and leave out login tokens, cookies and other private data.
  - type: input
    id: app-version
    attributes:
      label: Lurk version
      description: You can find it in Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "15"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Phone model"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which streaming platform were you using?
      options:
        - Twitch
        - Kick
        - Both
        - Not platform specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a stream
        2. Rotate the phone
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If you can, export the crash log from Settings → About and paste it here. Remove anything personal first.
      render: text
