name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build-logic tests
        run: ./gradlew -p build-logic :convention:test --stacktrace
      - name: Lint, test and assemble
        run: ./gradlew spotlessCheck detekt checkModuleBoundaries allTests :androidApp:app:testDebugUnitTest :androidApp:app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lurk-debug-apk
          path: androidApp/app/build/outputs/apk/debug/*.apk
          retention-days: 7
