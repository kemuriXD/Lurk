name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle daemon JDK, matching gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 25
      # Compile toolchain for build-logic and tools; set last so it stays JAVA_HOME
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build-logic tests
        run: ./gradlew -p build-logic :convention:test --stacktrace
      - name: Lint, test and assemble
        # One invocation: the unit tests run once, and with verifyRoborazziDebug in the graph the same run also checks
        # the screenshots.
        run: ./gradlew spotlessCheck detekt checkModuleBoundaries checkPackageLayout allTests testDebugUnitTest verifyRoborazziDebug :androidApp:app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lurk-debug-apk
          path: androidApp/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      # A failed screenshot check leaves the actual image and a diff next to each baseline; keep them to look at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lurk-screenshot-diffs
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
